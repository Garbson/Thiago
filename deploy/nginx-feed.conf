# Exposição pública mínima enquanto o site não tem domínio: só o feed dos portais e as fotos.
# Painel, login e o resto da API continuam acessíveis apenas por túnel SSH.
server {
    listen 8081;
    server_name _;

    location /api/portals/feed/ {
        proxy_pass http://127.0.0.1:3011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3011;
        proxy_set_header Host $host;
    }

    location / { return 404; }
}
